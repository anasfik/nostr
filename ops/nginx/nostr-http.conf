# Bootstrap only: install before requesting the certificate, then replace with nostr.conf.
server {
    listen 80;
    listen [::]:80;
    server_name nostr.gwhyyy.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 503;
    }
}
