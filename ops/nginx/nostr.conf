server {
    listen 80;
    listen [::]:80;
    server_name nostr.gwhyyy.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 301 https://nostr.gwhyyy.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nostr.gwhyyy.com;
    root /var/www/nostr/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/nostr.gwhyyy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nostr.gwhyyy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }
    # Flutter runs entirely in the browser; missing assets must not return index.html.
    location /playground/ { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
