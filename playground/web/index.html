<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A real Flutter web Nostr debug console built with dart_nostr: connect to relays, read events, generate ephemeral keys, sign and verify events, and publish only after explicit confirmation.">
  <!-- The readable SDK guides own search discovery; this canvas console is for hands-on use. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://nostr.gwhyyy.com/playground/">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F8FC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111B2B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nostr playground">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Nostr debug playground · dart_nostr</title>
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("assets/assets/fonts/IBMPlexSans.ttf") format("truetype");
      font-weight: 100 700;
      font-display: swap;
    }
    :root {
      color-scheme: light dark;
      --bg: #f6f8fc;
      --panel: #ffffff;
      --text: #17263e;
      --muted: #4a5b73;
      --border: #cbd5e2;
      --accent: #245ac4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111b2b;
        --panel: #18263b;
        --text: #ecf1fa;
        --muted: #b6c4da;
        --border: #43536c;
        --accent: #95bbff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 55%), var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .project-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      min-height: 48px;
      flex: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .project-nav a { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); text-decoration: underline; }
    .project-nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .project-nav span { margin-left: auto; color: var(--muted); }
    #flutter-host { position: absolute; inset: 48px 0 0 0; overflow: hidden; }
    /* Flutter's loader appends <flutter-view> to <body>, so contain it below the nav. */
    flutter-view {
      position: fixed !important;
      top: 48px !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: auto !important;
      height: auto !important;
    }
    #boot {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(560px, calc(100% - 32px));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(17, 27, 43, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; letter-spacing: -0.02em; }
    p { margin: 0; line-height: 1.5; }
    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      flex: none;
    }
    #boot.boot-error .spinner { animation: none; border-color: #d84a4a; }
    #boot-status { color: var(--muted); font-size: 0.92rem; }
    .boot-links { margin-top: 16px; font-size: 0.9rem; }
    .boot-links a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .boot-links a:hover, .boot-links a:focus-visible { text-decoration: underline; }
    .boot-links span { color: var(--muted); margin: 0 8px; }
    .boot-note { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.82rem; }
    noscript { color: var(--text); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
    }
    @media (max-width: 480px) {
      .project-nav span { display: none; }
      #boot { padding: 20px; }
      h1 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <nav class="project-nav" aria-label="Project">
    <a href="/">Home</a>
    <a href="/docs/">Documentation</a>
    <span>Leaving resets this ephemeral session.</span>
  </nav>
  <div id="flutter-host"></div>
  <div id="boot">
    <div class="row">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Nostr debug playground</h1>
    </div>
    <p id="boot-status" role="status" aria-live="polite">Loading the Flutter console…</p>
    <p class="boot-links">
      <a href="/">Home</a><span>·</span><a href="/docs/">Documentation</a>
    </p>
    <p class="boot-note">
      Nothing connects automatically. Ephemeral keys are generated in this
      browser tab only, and no analytics or key material is stored.
    </p>
    <noscript>
      <p class="boot-note">
        This playground is a Flutter web app and needs JavaScript enabled.
      </p>
    </noscript>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
